[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for Pre-Legal Document Generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.1",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.9.0",
    "passlib>=1.7.4",
    "bcrypt>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
